<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="說說板">
<meta name="theme-color" content="#1f6f5c">
<title>說說板</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <nav id="tabs" class="tabs" aria-label="分類"></nav>
    <button id="btnScan" class="icon-btn" aria-label="掃描模式"><span>👁️</span><small>掃描</small></button>
    <button id="btnSettings" class="icon-btn hold" aria-label="設定（按住一秒）"><i class="ring"></i><span>⚙️</span><small>按住</small></button>
  </header>

  <section id="banner" class="banner" aria-live="polite"><span id="bannerText">點一下想說的話（說明：按住右上角 ⚙️）</span></section>

  <main id="grid" class="grid"></main>

  <footer class="bottom">
    <div id="pager" class="pager">
      <button id="prev" class="pg">◀ 上一頁</button>
      <span id="pageInfo"></span>
      <button id="next" class="pg">下一頁 ▶</button>
    </div>
    <div id="quick" class="quick"></div>
  </footer>
</div>

<div id="editBar" class="edit-bar" hidden>
  <span>✏️ 編輯模式：點格子修改，按「＋」新增</span>
  <button id="btnDoneEdit" class="primary">完成</button>
</div>

<div id="scanBar" class="scan-bar" hidden>
  <button id="scanSelect" class="scan-select">👍 選這個</button>
  <button id="scanStop" class="scan-stop">停止</button>
</div>

<div id="alertOverlay" class="alert-overlay" hidden>
  <div class="alert-text">🔔 請過來一下！</div>
  <button id="alertClose" class="alert-close">我來了（關閉）</button>
</div>

<dialog id="dlgItem">
  <form method="dialog" class="dlg" onsubmit="return false">
    <h2 id="itemTitle">編輯格子</h2>
    <div class="row2">
      <label class="emoji-field">圖示<input id="fEmoji" maxlength="16" autocomplete="off"></label>
      <label class="grow">顯示文字<input id="fText" maxlength="20" autocomplete="off"></label>
    </div>
    <label>實際唸出的話（可留白，留白就唸顯示文字）<input id="fSay" maxlength="60" autocomplete="off"></label>
    <fieldset class="rec">
      <legend>家人錄音（可以錄台語，有錄音就優先播錄音）</legend>
      <div class="btns">
        <button type="button" id="recBtn">🎙️ 開始錄音</button>
        <button type="button" id="recPlay">▶️ 試聽</button>
        <button type="button" id="recDel">🗑️ 刪除錄音</button>
      </div>
      <small id="recStatus"></small>
    </fieldset>
    <div id="moveRow" class="row2">
      <button type="button" id="mvPrev">◀ 往前移</button>
      <button type="button" id="mvNext">往後移 ▶</button>
      <label class="grow">移到分類<select id="fCat"></select></label>
    </div>
    <div class="actions">
      <button type="button" id="itemDelete" class="danger">刪除這格</button>
      <span class="sp"></span>
      <button type="button" id="itemCancel">取消</button>
      <button type="button" id="itemSave" class="primary">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="dlgSettings">
  <form method="dialog" class="dlg" onsubmit="return false">
    <h2>設定</h2>

    <div class="btns">
      <a class="link-btn" href="help.html">📖 使用說明</a>
      <a class="link-btn" href="card.html">🖨️ 床邊小卡（可列印）</a>
    </div>

    <fieldset>
      <legend>版面</legend>
      <label>每列幾格 <select id="sCols"><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
      <label>每頁幾列 <select id="sRows"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
      <label class="check"><input type="checkbox" id="sNight"> 夜間模式（深色）</label>
      <label class="check"><input type="checkbox" id="sWake"> 螢幕保持亮著</label>
    </fieldset>

    <fieldset>
      <legend>聲音</legend>
      <label>語速 <input type="range" id="sRate" min="0.5" max="1.3" step="0.1"> <output id="sRateOut"></output></label>
      <label>電腦語音 <select id="sVoice"></select></label>
      <button type="button" id="sTest">🔊 試聽</button>
    </fieldset>

    <fieldset>
      <legend>掃描模式（照顧者陪同用）</legend>
      <label>每格停留 <select id="sScan">
        <option value="1500">1.5 秒</option><option value="2000">2 秒</option><option value="2500">2.5 秒</option>
        <option value="3000">3 秒</option><option value="4000">4 秒</option><option value="5000">5 秒</option>
      </select></label>
      <label class="check"><input type="checkbox" id="sScanSpeak"> 掃描時唸出每一格</label>
    </fieldset>

    <fieldset>
      <legend>分類</legend>
      <div id="catList" class="cat-list"></div>
      <button type="button" id="catAdd">＋ 新增分類</button>
    </fieldset>

    <fieldset>
      <legend>編輯與備份</legend>
      <div class="btns">
        <button type="button" id="sEdit" class="primary">✏️ 進入編輯模式</button>
        <button type="button" id="sExport">⬇️ 匯出備份</button>
        <label class="file-btn">⬆️ 匯入備份<input type="file" id="sImport" accept="application/json,.json" hidden></label>
        <button type="button" id="sReset" class="danger">還原預設</button>
      </div>
      <small>資料只存在這台平板上，不會上傳。換平板時用「匯出／匯入」搬過去（錄音也會一起帶走）。</small>
    </fieldset>

    <div class="actions">
      <span class="sp"></span>
      <button type="button" id="sClose" class="primary">關閉</button>
    </div>
  </form>
</dialog>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
